map $http_upgrade $inviteme_connection_upgrade {
    default upgrade;
    '' close;
}

map $host $inviteme_is_api_host {
    default 0;
    api.inviteme.asia 1;
}

map $uri $inviteme_is_acme_challenge {
    default 0;
    ~^/\.well-known/acme-challenge/ 1;
}

map "$inviteme_is_api_host:$inviteme_is_acme_challenge" $inviteme_redirect_http_to_https {
    default 0;
    "1:0" 1;
}
