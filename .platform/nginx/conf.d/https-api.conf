server {
    listen 443 ssl;
    server_name api.inviteme.asia;

    include /etc/nginx/ssl-api.inviteme.asia.conf;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Images (wedding media, transfer photos) are up to 5 MB; the API enforces the exact limits. Nginx defaults to 1 MB.
    client_max_body_size 6m;

    # JSON compresses about 4x (the seating plan of a 200-guest wedding: ~200 KB -> ~47 KB). Realtime streams
    # (text/event-stream) and WebSocket frames are not in gzip_types and stay uncompressed.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/problem+json text/plain text/csv;

    location / {
        proxy_pass http://docker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $inviteme_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
