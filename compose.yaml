services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: inviteme
      POSTGRES_USER: inviteme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inviteme -d inviteme"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    profiles: ["app"]
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PostgreSQL: Host=postgres;Database=inviteme;Username=inviteme;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Frontend__Url: http://localhost:5173
    ports:
      - "127.0.0.1:5043:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
