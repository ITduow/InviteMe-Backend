name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-elastic-beanstalk
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  EB_APPLICATION_NAME: inviteme-backend
  EB_ENVIRONMENT_NAME: Inviteme-backend-env

jobs:
  deploy:
    name: Build & Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore & Publish API
        run: |
          dotnet publish src/InviteMe.Api/InviteMe.Api.csproj -c Release -o ./publish
          rm -f ./publish/.env ./publish/appsettings.Development.json

      - name: Create runtime Dockerfile & deployment package
        run: |
          cat << 'EOF' > ./publish/Dockerfile
          FROM mcr.microsoft.com/dotnet/aspnet:10.0
          WORKDIR /app
          EXPOSE 8080
          ENV ASPNETCORE_URLS=http://+:8080
          COPY . .
          ENTRYPOINT ["dotnet", "InviteMe.Api.dll"]
          EOF
          cd ./publish
          zip -r ../deploy.zip .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload package to S3 & Deploy to Elastic Beanstalk
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          S3_BUCKET="elasticbeanstalk-${AWS_REGION}-${ACCOUNT_ID}"
          VERSION_LABEL="build-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          S3_KEY="${EB_APPLICATION_NAME}/${VERSION_LABEL}.zip"

          echo "Uploading deploy.zip to s3://${S3_BUCKET}/${S3_KEY}..."
          aws s3 cp deploy.zip "s3://${S3_BUCKET}/${S3_KEY}"

          echo "Creating Elastic Beanstalk application version ${VERSION_LABEL}..."
          aws elasticbeanstalk create-application-version \
            --application-name "${EB_APPLICATION_NAME}" \
            --version-label "${VERSION_LABEL}" \
            --source-bundle S3Bucket="${S3_BUCKET}",S3Key="${S3_KEY}"

          echo "Waiting for environment ${EB_ENVIRONMENT_NAME} to be Ready..."
          aws elasticbeanstalk wait environment-updated \
            --application-name "${EB_APPLICATION_NAME}" \
            --environment-names "${EB_ENVIRONMENT_NAME}"

          echo "Updating environment ${EB_ENVIRONMENT_NAME} to ${VERSION_LABEL}..."
          aws elasticbeanstalk update-environment \
            --application-name "${EB_APPLICATION_NAME}" \
            --environment-name "${EB_ENVIRONMENT_NAME}" \
            --version-label "${VERSION_LABEL}"

          echo "Waiting for deployment to complete..."
          aws elasticbeanstalk wait environment-updated \
            --application-name "${EB_APPLICATION_NAME}" \
            --environment-names "${EB_ENVIRONMENT_NAME}"
